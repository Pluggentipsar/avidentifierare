[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
regex = "1"
aho-corasick = "1"
ort = "=2.0.0-rc.12"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
docx-rs = "0.4"
candle-core = "0.10"
candle-transformers = "0.10"

# Optimize dependencies even in dev builds so local LLM/NER inference is usable under `tauri dev`.
# Our own crate stays unoptimized for fast, debuggable rebuilds.
[profile.dev.package."*"]
opt-level = 3

